# Datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=META-INF/import.sql
quarkus.hibernate-orm.log.sql=false

# JAX-RS base path (replaces @ApplicationPath("/services"))
quarkus.resteasy.path=/services

# Reactive messaging channels are wired in-process (no external broker required)
# SmallRye auto-wires @Channel("orders") Emitter to all @Incoming("orders") consumers
